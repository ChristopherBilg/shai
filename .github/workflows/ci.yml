# ci.yml — CI pipeline: tests, linting, conventions, docs, compat, and security checks
name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite (offline; curl + gh stubbed)
        run: ./tests/run.sh

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bash 4.4
        id: bash44
        uses: actions/cache@v4
        with:
          path: ~/bash44
          key: bash-4.4.18-${{ runner.os }}
      - name: Build bash 4.4
        if: steps.bash44.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://ftp.gnu.org/gnu/bash/bash-4.4.18.tar.gz | tar xz
          cd bash-4.4.18
          ./configure --prefix="$HOME/bash44" >/dev/null 2>&1
          make -j"$(nproc)" >/dev/null 2>&1
          make install >/dev/null 2>&1
      - name: Run tests under bash 4.4
        run: |
          sudo ln -sf "$HOME/bash44/bin/bash" /bin/bash
          bash --version | head -1
          bash tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache lint tools
        uses: actions/cache@v4
        with:
          path: bin
          key: lint-tools-${{ hashFiles('tests/lint-tools.sha256') }}
      - name: Install pinned lint tools
        run: ./tests/install-lint-tools.sh
      # If you change these globs, also update README.md and CLAUDE.md
      - name: ShellCheck all scripts
        run: ./bin/shellcheck install.sh shai-* lib/*.sh workflows/*.sh tests/*.sh
      - name: shfmt diff check
        run: ./bin/shfmt -d install.sh shai-* lib/*.sh workflows/*.sh tests/*.sh

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project conventions
        run: ./tests/conventions.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks (fail-closed)
        run: ./tests/docs.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified

  tool-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tools.json against Anthropic tool schema
        run: ./tests/validate-tool-schema.sh
