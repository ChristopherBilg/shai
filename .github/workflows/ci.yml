# ci.yml — CI pipeline: test suite, shellcheck, shfmt, conventions, and docs checks on push
name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite (offline; curl + gh stubbed)
        run: ./tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned lint tools
        run: ./tests/install-lint-tools.sh
      - name: ShellCheck all scripts
        run: ./bin/shellcheck shai shai-read shai-context shai-eval shai-dispatch shai-print tests/*.sh

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned lint tools
        run: ./tests/install-lint-tools.sh
      - name: shfmt diff check
        run: ./bin/shfmt -d shai shai-read shai-context shai-eval shai-dispatch shai-print tests/*.sh

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project conventions
        run: ./tests/conventions.sh
