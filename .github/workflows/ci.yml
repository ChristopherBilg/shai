# ci.yml — CI pipeline: tests, linting, conventions, docs, and security checks
name: CI

on:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite (offline; curl + gh stubbed)
        run: ./tests/run.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache lint tools
        uses: actions/cache@v4
        with:
          path: bin
          key: lint-tools-${{ hashFiles('tests/lint-tools.sha256') }}
      - name: Install pinned lint tools
        run: ./tests/install-lint-tools.sh
      # The lint target lives in tests/lint.sh (derived from git), not in a glob spelled out
      # here: four hand-maintained copies of it drifted and left tools/*/run.sh unlinted (#81).
      - name: ShellCheck + shfmt (tests/lint.sh)
        run: ./tests/lint.sh

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project conventions
        run: ./tests/conventions.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks (fail-closed)
        run: ./tests/docs.sh

  completions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Completion manifest sync check
        run: ./tests/completions-sync.sh

  tools-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool documentation sync check
        run: ./tests/tools-sync.sh

  constants-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Constants documentation sync check
        run: ./tests/constants-sync.sh

  doctor-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doctor dependency sync check
        run: ./tests/doctor-sync.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified

  tool-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tools.json against Deepseek tool schema
        run: ./tests/validate-tool-schema.sh
